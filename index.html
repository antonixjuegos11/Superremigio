function cMsg(m){if(!m||typeof m!='object')return;

function cState(m){const v=m.v;if(!v||!Array.isArray(v.pl)||v.pl.length!=4)return;const old=G&&G.pl&&(!v.round||G.round==v.round)?G.pl[0].hand:null,sid=old&&G.sel!=null&&old[G.sel]?old[G.sel].id:null;

 return `<div class="card ${x}" style="${st}${f.ink[c.s]};${ex}"><span class="v">${VL[c.v]}</span><span class="s">${f.sym[c.s]}</span><span class="v2">${VL[c.v]}</span></div>`}
function seat(i,a){const p=G.pl[i];return `<div class="seat ${G.turn==i&&!G.over?'act':''}" style="grid-area:${a}">${avH({avs:p.av,ph:p.ph,fr:p.fr},28)} <b>${p.name}</b>${p.title?`<br><span class="tt">«${p.title}»</span>`:''}${G.sc?`<div class="tt">${G.sc[i]}/100${G.sc[i]>=100?' · eliminado':''}</div>`:''}<div class="cs">${p.hand.map(()=>back(p.deck,'mini')).join('')}</div>${p.hand.length} cartas</div>`}
let DR=null;
function table(){table0();fitHand()}
function table0(){if(DR!=null)return;if(ON&&ON.role=='h'&&G)setTimeout(bcast,0);const p=G.pl[0],top=G.disc[G.disc.length-1],my=!G.spec&&G.turn==0&&!G.over,M=S.set.hint&&!G.spec?marks(G.pl[0].hand):{},useful=!!(my&&G.ph=='draw'&&S.set.hint&&G.disc.length&&cover(G.pl[0].hand.concat(G.disc[G.disc.length-1]))>cover(G.pl[0].hand));
 let m=G.over?'Partida terminada':my?(G.ph=='draw'?'Tu turno: roba del mazo o del pozo':'Elige una carta para descartar'+(G.tc[0]<1?' (no se puede cerrar en la 1ª ronda)':'')):G.pl[G.turn].name+' está pensando…';
 if(G.spec)m='👁 Estás viendo la partida de '+G.pl[0].name;else if(G.mode=='desc'&&G.sc){if(G.sc[0]>=100)m='🚫 Estás eliminado · sigues viendo la partida';else if(!G.over)m+=' · Sin casar: '+Math.max(0,p.hand.length-cover(p.hand))}
 let rest=G.sel!=null?p.hand.filter((_,k)=>k!=G.sel):[],can=my&&G.ph=='disc'&&G.sel!=null&&G.tc[0]>=1&&cover(rest)==10;
 app.innerHTML=`<div class="bar"><b>${G.mode=='rank'?'🏅 Clasificatoria':G.mode=='online'?'🌐 Online':G.mode=='desc'?'📉 Al Descuento · Ronda '+G.round+' · tú: '+G.sc[0]+'/100':'⚡ Partida Rápida'}</b>${spN()?`<span class="eye">👁 ${spN()}</span>`:''}<button onclick="abn()">${G.spec?'Salir':'Abandonar'}</button></div><div class="table">${seat(2,'top')}${seat(1,'left')}${seat(3,'right')}
 <div class="mid"><div class="pile" onclick="doDraw('d')">${back(p.deck)}<br>Mazo (${G.draw.length})</div><div class="pile" onclick="doDraw('p')">${top?cardH(top,useful?'glow':'',G.pl[0].deck):''}<br>Pozo${useful?' ✨ ¡te sirve!':''}</div></div>
 <div style="grid-area:me" class="${my?'':''}"><div class="msg">${m}<span id="tm" class="tmr"></span></div><div class="hand">${G.spec?p.hand.map(()=>back(p.deck)).join(''):p.hand.map((c,i)=>cardH(c,(G.sel==i?'sel':'')+(M[c.id]?' '+M[c.id].cl:''),p.deck,M[c.id]?'--gc:'+M[c.id].col:'').replace('class="card',`data-i="${i}" onclick="selC(${i})" class="card`)).join('')}</div>
 ${S.set.hint&&!G.spec?'<div class="leg2">Sólido = grupo formado · Punteado = pareja que busca carta</div>':''}<div class="row" ${G.spec?'style="display:none"':''}><button ${G.sel==null?'disabled':''} onclick="moveSel(-1)">◀</button><button ${G.sel==null?'disabled':''} onclick="moveSel(1)">▶</button><button onclick="sortH(G.pl[0].hand);G.sel=null;table()">Ordenar</button><button class="pri" ${my&&G.ph=='disc'&&G.sel!=null?'':'disabled'} onclick="doDiscard()">${can?'🎉 Descartar y CERRAR':'Descartar'}</button></div></div></div>`}
function selC(i){if(G.spec||G.over||Date.now()-DROPPED<300)return;const now=Date.now();if(LT.i==i&&now-LT.t<380&&G.sel==i&&G.turn==0&&G.ph=='disc'){LT={i:-1,t:0};return doDiscard()}LT={i,t:now};snd('pick');G.sel=G.sel==i?null:i;table()}
function moveSel(d){const h=G.pl[0].hand,i=G.sel,n=h.length;if(i==null||n<2)return;const j=(i+d+n)%n,c=h.splice(i,1)[0];h.splice(j,0,c);G.sel=j;table()}
function dropC(j){const h=G.pl[0].hand,i=DR;DR=null;if(i==null||i==j)return table();const c=h.splice(i,1)[0];h.splice(j,0,c);G.sel=j;table()}
function take(p,src){snd('draw');let c;if(src=='d'){if(!G.draw.length){const t=G.disc.pop();G.draw=G.disc.sort(()=>Math.random()-.5);G.disc=[t]}c=G.draw.pop()}else c=G.disc.pop();p.hand.push(c)}
function doDraw(src){if(G.spec||G.over||G.turn!=0||G.ph!='draw')return;if(ON&&ON.role=='c'){ON.conn.send({t:'draw',src});return}take(G.pl[0],src);G.ph='disc';if(S.set.auto){sortH(G.pl[0].hand);G.sel=null}table()}
function doDiscard(){if(G.spec||G.sel==null||G.over||G.turn!=0||G.ph!='disc')return;if(ON&&ON.role=='c'){ON.conn.send({t:'disc',id:G.pl[0].hand[G.sel].id});G.sel=null;return}discard(0,G.sel)}
function discard(pi,i){snd('disc');const p=G.pl[pi],c=p.hand.splice(i,1)[0];c.d=p.deck;if(G.tc[pi]>=1&&p.hand.length==10&&cover(p.hand)==10){G.disc.push(c);return end(pi)}
 G.disc.push(c);G.tc[pi]++;if(p.bot&&Math.random()<.06)botSay(p);G.turn=nxa(pi);G.ph='draw';if(G.turn==0)snd('turn');if(pi==0)G.sel=null;table();next()}
function botDisc(p){const b=bestDisc(p.hand,p.lvl),m=p.lvl==1?.35:.12;return Math.random()<(b.e>=100?m*1.5:m)?rnd(0,p.hand.length-1):b.i}
function next(){armTimer();if(G.over||G.turn==0||(ON&&ON.role!='h'))return;const p=G.pl[G.turn];if(p.remote)return;setTimeout(()=>{if(G.over)return;
 const top=G.disc[G.disc.length-1],b=ev(p.hand,p.lvl);let useD=false;
 if(top){const h2=p.hand.concat(top);useD=(p.lvl==1?bestDisc(h2,1).e>cover(p.hand)*10:bestDisc(h2,2).e>b+4)&&Math.random()>.2}
 take(p,useD?'p':'d');table();setTimeout(()=>{if(G.over)return;discard(G.turn,botDisc(p))},rnd(1500,3500)*S.set.speed)},rnd(1500,3500)*S.set.speed)}
function quit(){G.over=true;clearTimeout(G.tt);finish(-1)}
const nxa=i=>{let j=(i+1)%4;while(G.out&&G.out[j]&&j!=i)j=(j+1)%4;return j};
const scoreTbl=w=>`<div style="text-align:left;margin:8px 0">${G.pl.map((p,i)=>({p,i})).sort((a,b)=>G.sc[a.i]-G.sc[b.i]).map(x=>`<div class="set"><span>${x.i==w?'🏆 ':''}${x.p.name}</span><b>${G.sc[x.i]}${G.sc[x.i]>=100?' 🚫':''}</b></div>`).join('')}</div>`;
function showRound(add,w){const o0=$('#rsum');o0&&o0.remove();const o=document.createElement('div');o.id='rsum';o.className='ov';
 o.innerHTML=`<div class="box"><h2>📉 Fin de la ronda ${G.round||1}</h2><p>${G.pl[w]?G.pl[w].name:'Alguien'} ha cerrado.</p>${G.pl.map((p,i)=>`<div class="set"><span>${p.name}${G.sc[i]>=100?' · 🚫 eliminado':''}</span><span>${i==0?(add[0]?'+'+add[0]:'—')+' → ':''}<b>${G.sc[i]}</b>/100</span></div>`).join('')}<p class="sub">La siguiente ronda empieza enseguida…</p></div>`;document.body.appendChild(o)}
function roundEnd(w){G.over=true;clearTimeout(G.tt);const R=(a,k)=>a.map((_,j)=>a[(k+j)%4]);
 const add=G.pl.map((p,i)=>G.out[i]||i==w?0:Math.max(0,p.hand.length-cover(p.hand)));
 add.forEach((a,i)=>{G.sc[i]+=a;if(G.sc[i]>=100)G.out[i]=true});
 const alive=G.out.map((o,i)=>o?-1:i).filter(i=>i>=0);
 if(alive.length<=1){const win=alive.length?alive[0]:G.sc.indexOf(Math.min(...G.sc));
  if(ON&&ON.role=='h')ON.conns.forEach((c,k)=>c&&c.open&&c.send({t:'end',w:(win-k+4)%4,hand:[],sc:R(G.sc,k)}));if(ON&&ON.role=='h')(ON.specs||[]).forEach(c=>c.open&&c.send({t:'end',w:win,hand:[],sc:G.sc.slice()}));
  G.pl.forEach(p=>{if(p.bot&&Math.random()<.5)setTimeout(()=>botSay(p,'GG'),rnd(600,2000))});return finish(win)}
 if(ON&&ON.role=='h')ON.conns.forEach((c,k)=>c&&c.open&&c.send({t:'round',add:R(add,k).map((a,j)=>j==0?a:0),sc:R(G.sc,k),out:R(G.out,k),w:(w-k+4)%4}));if(ON&&ON.role=='h')(ON.specs||[]).forEach(c=>c.open&&c.send({t:'round',add:[0,0,0,0],sc:G.sc.slice(),out:G.out.slice(),w:w}));
 showRound(add,w);table();clearTimeout(G.rt);G.rt=setTimeout(newRound,7000)}
function newRound(){if(!G||G.mode!='desc'||G.done||G.over!==true)return;const o=$('#rsum');o&&o.remove();
 let d=[];for(let r=0;r<2;r++)for(let s=0;s<4;s++)for(let v=1;v<=12;v++)d.push({s,v,id:d.length});for(let i=0;i<4;i++)d.push({s:-1,v:0,id:d.length});d.sort(()=>Math.random()-.5);
 G.pl.forEach((p,i)=>{p.hand=G.out[i]?[]:d.splice(0,10)});G.draw=d;G.disc=[d.pop()];G.st=nxa(G.st);G.turn=G.st;G.ph='draw';G.sel=null;G.over=false;G.tc=[0,0,0,0];G.round++;G.dl=0;
 sortH(G.pl[0].hand);table();next()}
function end(w){if(G.mode=='desc')return roundEnd(w);G.over=true;clearTimeout(G.tt);if(ON&&ON.role=='h')ON.conns.forEach((c,k)=>c&&c.open&&c.send({t:'end',w:(w-k+4)%4,hand:G.pl[w].hand}));if(ON&&ON.role=='h')(ON.specs||[]).forEach(c=>c.open&&c.send({t:'end',w:w,hand:G.pl[w].hand}));G.pl.forEach(p=>{if(p.bot&&Math.random()<.5)setTimeout(()=>botSay(p,'GG'),rnd(600,2000))});finish(w)}
function finish(w){G.done=true;clearTimeout(G.rt);try{if(ON&&ON.role!='s'&&FB&&U&&FB.r)FB.r.ref('live/'+U.uid).remove()}catch(e){}const rs0=$('#rsum');rs0&&rs0.remove();const ranked=G.mode=='rank',won=w==0;let info='';S.games++;mission('play');
 if(won){S.wins++;S.coins+=2;mission('win');info='+2 🪙';if(G.pl[0].hand.some(c=>c.s<0))mission('joker')}
 if(ranked){const real=S.pts>=600;if(won){const d=rnd(15,25);S.pts+=d;info+=` · +${d} pts`}else{const d0=rnd(5,10),o=S.pts;S.pts=Math.max(real?600:0,S.pts-d0);const d=o-S.pts;if(!d)info+=' · 🛡️ Rango protegido';else info+=` · −${d} pts`}}
 if(w>=0)snd(won?'win':'lose');if(ranked){S.rg=(S.rg||0)+1;mev('ranked');if(won){mev('rwin');S.rwn=(S.rwn||0)+1}}if(ON)mev('online');if(w>=0)psXP(20+(won?40:0)+(ranked?10:0));S.streak=won?S.streak+1:0;S.bs=Math.max(S.bs,S.streak);if(ranked)awardRanks();chk();save();const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="box"><h2>${w<0?'Has abandonado':won?'🎉 ¡Has ganado!':'Gana '+G.pl[w].name}</h2>${G.sc?scoreTbl(w):w>=0?`<div class="wh">${sortH(G.pl[w].hand).map(c=>cardH(c,'',G.pl[0].deck)).join('')}</div>`:''}<p>${info||'Sin recompensa'}</p><button class="pri" onclick="this.closest('.ov').remove();menu()">Volver al menú</button></div>`;
 document.body.appendChild(o);if(w>=0)table()}
ap();rollSeason();menu();if(!S.tut)tut(0);else dayCheck();fbInit();
</script></body></html>
